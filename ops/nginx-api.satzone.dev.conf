# Reverse-proxy vhost for the SATZone backend API.
# Place at /etc/nginx/sites-available/api.satzone.dev, symlink into
# sites-enabled, then run certbot to add TLS (see README/HTTPS notes).
#
# The api container binds to 127.0.0.1:8000 only (docker-compose.yml).
# All public traffic to api.satzone.dev terminates TLS here.

server {
    listen 80;
    listen [::]:80;
    server_name api.satzone.dev;

    # Let certbot answer ACME http-01 challenges here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else: redirect to HTTPS. Certbot --nginx will add this
    # automatically after the first cert issuance; safe to keep either way.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.satzone.dev;

    # Filled in by `certbot --nginx -d api.satzone.dev` — leave commented
    # until certbot has run; nginx will refuse to start without real files.
    # ssl_certificate     /etc/letsencrypt/live/api.satzone.dev/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.satzone.dev/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Match the limit on the frontend vhost; bump higher (e.g. 500M) if
    # instructors upload videos through this hostname.
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket / SSE pass-through in case any endpoint adopts them.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Hide dotfiles (except ACME).
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
