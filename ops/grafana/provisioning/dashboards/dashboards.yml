apiVersion: 1

# Tells Grafana to load every JSON dashboard under
# ``/var/lib/grafana/dashboards`` (which docker-compose bind-mounts from
# ``ops/grafana/dashboards``). Dropping a new .json there and bouncing the
# container is enough to publish a dashboard.
providers:
  - name: satzone
    orgId: 1
    folder: Satzone
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
